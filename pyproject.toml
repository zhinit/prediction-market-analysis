[project]
name = "pma"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.8"
dependencies = [
    "duckdb>=1.5.4",
    "httpx>=0.28.1",
    "matplotlib>=3.11.0",
    "polars>=1.42.1",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
    "notebook>=7.6.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["db/scripts"]
